<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0d10" />
  <title>Garumi | Know your car - from the car, not from a chat.</title>
  <meta name="description" content="Know your car - from the car, not from a chat. Built first for BRZ, GR86, G37, and Q60 owners in the US. Nothing to buy yet." />
  <link rel="canonical" href="https://garumi.com/" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e4b15c'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='%231c1408'%3EG%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0c0d10;
      --text: #f4f6f8;
      --muted: #b7c0cc;
      --line: #343b48;
      --field: #12141a;
      --accent: #e4b15c;
      --accent-hover: #f0c57a;
      --ink: #1c1408;
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 1.0625rem;
    }

    main {
      width: min(26.5rem, calc(100% - 2.5rem - env(safe-area-inset-left) - env(safe-area-inset-right)));
      margin: 0 auto;
      padding: max(2.75rem, env(safe-area-inset-top)) 0 max(3rem, env(safe-area-inset-bottom));
    }

    .brand {
      margin: 0 0 1.15rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.75rem, 7vw, 2.25rem);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .note {
      margin: 0 0 0.55rem;
      color: var(--muted);
    }

    .note:last-of-type { margin-bottom: 1.75rem; }

    .field { margin: 0 0 0.85rem; }

    label {
      display: block;
      margin: 0 0 0.35rem;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .opt {
      color: var(--muted);
      font-weight: 500;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      min-height: 52px;
      margin-top: 0.25rem;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
    }

    button:hover { background: var(--accent-hover); }

    .support {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .hp {
      display: none;
    }

    #thanks { display: none; }

    #thanks:target { display: block; }

    #thanks:target ~ form { display: none; }

    .thanks h2 {
      margin: 0 0 0.45rem;
      font-size: 1.45rem;
      line-height: 1.2;
      font-weight: 700;
    }

    .thanks p {
      margin: 0 0 0.9rem;
      color: var(--muted);
    }

    .thanks a {
      color: var(--accent);
      font-weight: 700;
    }

    @media (min-width: 720px) {
      body {
        display: grid;
        align-items: center;
      }

      main { padding-top: 3rem; padding-bottom: 3rem; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Garumi</p>
    <h1>Know your car - from the car, not from a chat.</h1>
    <p class="note">Built first for BRZ, GR86, G37, and Q60 owners in the US.</p>
    <p class="note">We're finishing the always-on path. Nothing to buy yet.</p>

    <div id="thanks" class="thanks" tabindex="-1">
      <h2>You're on the list.</h2>
      <p>We'll email you when it's ready for a real drive.</p>
      <p><a href="./">Back to Garumi</a></p>
    </div>

    <form action="https://formsubmit.co/guybelo@me.com" method="POST" aria-label="Get notified">
      <input type="hidden" name="_subject" value="Garumi waitlist" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_next" value="https://garumi.com/#thanks" />
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" />

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="name">Name <span class="opt">(optional)</span></label>
        <input id="name" name="name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="car">Car <span class="opt">(optional)</span></label>
        <input id="car" name="car" autocomplete="off" />
      </div>

      <button type="submit">Get notified</button>
      <p class="support">when it's ready for a real drive.</p>
    </form>
  </main>
  <script>
    (function () {
      if (location.hash !== "#thanks") return;
      var thanks = document.getElementById("thanks");
      if (thanks) thanks.focus();
    })();
  </script>
</body>
</html>
